[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climbench-submit"
version = "0.1.0"
description = "Prediction submission and local training metadata export for ClimBench."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "climbench contributors"}]
dependencies = ["typer", "httpx>=0.27,<1", "PyYAML", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
climbench-submit = "climbench_submit.cli:submit_app"
climbench-metadata = "climbench_submit.cli:metadata_app"

[tool.hatch.build.targets.wheel]
packages = ["src/climbench_submit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
